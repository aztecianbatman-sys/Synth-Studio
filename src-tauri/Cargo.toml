[package]
name = "synth-studio"
version = "0.1.0"
description = "Synth Studio - local AI workspace by Fulltrack"
authors = ["Fulltrack"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "synth_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
