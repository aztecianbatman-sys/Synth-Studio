[package]
name = "synth-studio"
version = "0.3.0"
description = "Synth Studio - lightweight local AI workspace by Fulltrack"
authors = ["Fulltrack"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "synth_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
cuda = ["candle-core/cuda", "candle-transformers/cuda"]

[build-dependencies]
tauri-build = "2.6"

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.6"
tauri-plugin-fs = "2.4"
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
candle-core = "0.9.1"
candle-transformers = "0.9.1"
tokenizers = "0.21.4"
sysinfo = "0.36.1"
