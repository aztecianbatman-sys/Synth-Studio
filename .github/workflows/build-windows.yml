name: Build Synth Studio Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate official Tauri icon set
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/icons/icon.ico") {
            Remove-Item "src-tauri/icons/icon.ico" -Force
          }
          if (Test-Path "src-tauri/icons/icon.icns") {
            Remove-Item "src-tauri/icons/icon.icns" -Force
          }
          npx tauri icon "public/synth-logo.png" -o "src-tauri/icons"
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Tauri did not generate icon.ico"
          }

      - name: Build Tauri application
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: synth-studio-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
